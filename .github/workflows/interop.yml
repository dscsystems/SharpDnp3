name: Interop

# The otfabric/dnp3-interop reference implementations (opendnp3 and DSC go-dnp3,
# each in a container) against our master and our outstation. The Step Function
# I/O image is not published, so it is not part of this run. The go-dnp3 and
# opendnp3 binary suites need locally built peers and are not run here.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: 'dnp3-interop release whose images to use'
        required: false
        default: 'v0.5.1'
  pull_request:
    paths:
      - 'src/SharpDnp3/**'
      - 'tests/SharpDnp3.Interop.Tests/**'
      - '.github/workflows/interop.yml'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DNP3_INTEROP_ADAPTERS: 'opendnp3,dscsystems'

jobs:
  otfabric:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run the interop tests against the reference images
        env:
          DNP3_INTEROP_TAG: ${{ inputs.tag || 'v0.5.1' }}
        run: >
          dotnet test tests/SharpDnp3.Interop.Tests/SharpDnp3.Interop.Tests.csproj
          --filter "FullyQualifiedName~Otfabric"
